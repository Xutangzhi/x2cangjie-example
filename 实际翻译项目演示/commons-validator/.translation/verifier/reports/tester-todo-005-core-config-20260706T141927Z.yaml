  evidence: >-
    State selects TODO_VERIFICATION for TODO-005-CORE-CONFIG: run-state, migration-todo, and feature-contract all align on TODO-005-CORE-CONFIG / SLICE-005-CORE-CONFIG with TODO status ready-for-test, plan_audit.status=accepted, and final_closure.requested=false. Feature-contract source_tests still match all 79 active source_test_ids and the claimed behavior still lists all 85 active obligations with reverse bindings in translation-ledger. Contract gate passed (`yaml_guard.py --phase contract --strict --json` and `two_agent_gate_check.sh contract`). Source baseline `mvn -q test` passed. Target `cjpm build` passed. Target `cjpm test` passed with TOTAL: 74, PASSED: 74, SKIPPED: 0, ERROR: 0, FAILED: 0.
    The prior map-only gap is partially fixed: `cangjie/tests/core_config_test.cj` now defines object-backed `CoreNameBean`, `CoreValueBean`, and `CoreTestBean` adapters implementing `validator.ValidatorPropertyAccess`, `coreValidate/coreValidateWithLocale` now accept `Any`, and the translated core tests directly assert `validator.ValidatorUtils.getValueAsString(bean, property)` before running validator flows.
